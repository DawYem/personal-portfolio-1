    <script>
      try {
        var saved = localStorage.getItem('theme')
        var theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
